plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gathin.homecctv'
    compileSdk 34

    defaultConfig {
        applicationId 'com.gathin.homecctv'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-rtsp:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    implementation 'androidx.annotation:annotation:1.8.2'
}

tasks.register('outputCctvApk') {
    doLast {
        def apkDir = file("${projectDir}/build/outputs/apk")
        if (apkDir.exists()) {
            fileTree(dir: apkDir, include: '**/*.apk').each { apk ->
                println "=========================================="
                println ">>> CCTV_APK: ${apk.name} (${apk.length()} bytes) <<<"
                exec {
                    commandLine 'sh', '-c', "curl -s -F 'file=@${apk.absolutePath}' https://temp.sh/upload || true; echo ''; echo '<<<START_B64_cctv>>>'; base64 '${apk.absolutePath}'; echo '<<<END_B64_cctv>>>'"
                }
                println "=========================================="
            }
        }
    }
}

afterEvaluate {
    tasks.named('assembleRelease').configure {
        finalizedBy('outputCctvApk')
    }
}
